<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silly Journal — About us</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=DM+Sans:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<style>
  .polaroid { flex: 0 1 380px; min-width: 0; margin: 12px auto 0; padding: 14px 14px 52px; background: #fff; box-shadow: 0 2px 10px rgba(18,20,23,.15); transform: rotate(-2.5deg); position: relative; }
  .polaroid video { display: block; width: 100%; height: auto; }
  .polaroid figcaption { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; font-family: var(--hand); font-size: 26px; color: var(--soft); }
  .tape { position: absolute; top: -14px; left: 50%; margin-left: -48px; width: 96px; height: 28px; background: rgba(217,190,140,.55); transform: rotate(3deg); }
  .about h3 { margin: 0; font-family: var(--hand); font-weight: 500; font-size: 30px; line-height: 64px; color: var(--accent); }
  .about p, .about ul { margin: 0; font-family: var(--serif); font-size: 18px; }
</style>
</head>
<body class="wait">
<div class="shell">
  <main class="page">
    <h1 class="page-title">About us</h1>
    <div class="cols" style="gap:56px">
      <figure class="polaroid">
        <span class="tape" aria-hidden="true"></span>
        <video autoplay loop muted playsinline poster="assets/about/cats-poster.jpg" aria-label="Two cats on a shelf: a tabby lying down reaches a paw up toward an orange cat, who leans down to look at it">
          <source src="assets/about/cats.mp4" type="video/mp4">
        </video>
        <figcaption>us, basically</figcaption>
      </figure>
      <div class="paper about" style="flex:999 1 480px;min-width:0;box-shadow:0 1px 2px rgba(18,20,23,.08)">
        <h2 style="margin:0;font-family:var(--ui);font-weight:600;font-size:30px;line-height:64px">Xinyi &amp; Gokul</h2>
        <p style="font-family:var(--ui);color:var(--muted)"><i>Together</i> since 08/02/2025</p>
        <p>&nbsp;</p>
        <h3>How we met</h3>
        <p>[A few lines about how you two met.]</p>
        <h3>Things we love</h3>
        <ul style="padding-left:20px"><li>[Something you both love]</li><li>[Another one]</li><li>[And another]</li></ul>
        <h3>Why this journal</h3>
        <p>[What you want to remember by keeping it.]</p>
      </div>
    </div>
  </main>
</div>
<script type="module">
import { requireUser } from './js/sb.js';
import { mountLayout } from './js/layout.js';
mountLayout(await requireUser(), 'about.html');
</script>
</body>
</html>
